# Legal RAG local stack: the FastAPI API plus an optional Qdrant vector DB.
#
#   docker compose up api            # API only (offline mocks, numpy vectors)
#   docker compose --profile qdrant up   # API + Qdrant (set VECTOR_BACKEND=qdrant)
#
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Offline by default; flip these on (and mount a key) to use real models.
      - USE_REAL_LLM=0
      - USE_REAL_EMBEDDINGS=0
      - USE_REAL_RERANKER=0
      - VECTOR_BACKEND=numpy
      # To use Qdrant instead of the in-memory store:
      #   - VECTOR_BACKEND=qdrant
      #   - QDRANT_URL=http://qdrant:6333
    # depends_on:
    #   - qdrant

  # Optional vector database. Enable with:  docker compose --profile qdrant up
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
